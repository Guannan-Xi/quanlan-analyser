[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qlanalyser-eeg64-recovery"
version = "0.2.0"
description = "Evidence-driven modular recovery of full-recording 64-channel QEEG analysis"
requires-python = ">=3.10"
dependencies = ["mne>=1.8", "numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "antropy>=0.1.9"]

[project.optional-dependencies]
qc-iclabel = ["mne-icalabel>=0.7"]
aperiodic = ["specparam>=2.0.0rc0"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
