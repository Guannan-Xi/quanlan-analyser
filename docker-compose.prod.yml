version: '3.8'

# QLanalyser Production Docker Compose Configuration
# Optimized for Aliyun ECS deployment with high availability

services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: qlanalyser-backend
    restart: unless-stopped
    env_file:
      - deploy/aliyun/production.env
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # Persistent data volumes
      - uploads:/app/uploads
      - results:/app/results
      - artifacts:/app/artifacts
      - logs:/app/logs
      # Configuration files (optional)
      # - ./config:/app/config:ro
    networks:
      - qlanalyser-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # Frontend Nginx Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: qlanalyser-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx configuration
      - ./deploy/aliyun/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL certificates (mount from host or use volume)
      - ./ssl:/etc/nginx/ssl:ro
      # Nginx logs
      - nginx-logs:/var/log/nginx
      # Certbot challenge directory (for Let's Encrypt)
      - certbot-www:/var/www/certbot:ro
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      - backend
    networks:
      - qlanalyser-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Redis Cache (Optional - uncomment if using)
  # redis:
