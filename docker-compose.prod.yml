networks:
  qlanalyser-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  # Application data volumes
  uploads:
    driver: local
  results:
    driver: local
  artifacts:
    driver: local
  logs:
    driver: local
  
  # Service data volumes
  nginx-logs:
    driver: local
  certbot-www:
    driver: local
  
  # Optional service volumes (uncomment if using)
  # redis-data:
  #   driver: local
  # postgres-data:
  #   driver: local
